[workspace]
members = [
    "programs/agentvault"
]

resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[patch.crates-io]
# Solana SBF toolchain lags behind stable Cargo; pin to an edition2021 version.
# Patch must point to a different source, so use the upstream git tag.
blake3 = { git = "https://github.com/BLAKE3-team/BLAKE3", tag = "1.5.0" }
borsh = { git = "https://github.com/near/borsh-rs", tag = "v1.5.0" }
borsh-derive = { git = "https://github.com/near/borsh-rs", tag = "v1.5.0" }
