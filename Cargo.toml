[workspace]
members = [
    "programs/agentvault"
]

resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[patch.crates-io]
# Solana SBF toolchain lags behind stable Cargo; pin to an edition2021 version.
blake3 = "=1.5.0"
