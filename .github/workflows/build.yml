name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SOLANA_VERSION: 1.18.26
  ANCHOR_VERSION: 0.30.1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          curl -sSfL https://github.com/coral-xyz/anchor/releases/download/v${{ env.ANCHOR_VERSION }}/anchor-${{ env.ANCHOR_VERSION }}-x86_64-unknown-linux-gnu.tar.xz | tar -xJ
          sudo mv anchor-${{ env.ANCHOR_VERSION }}-x86_64-unknown-linux-gnu/anchor /usr/local/bin/

      - name: Verify installations
        run: |
          solana --version
          anchor --version
          rustc --version

      - name: Install dependencies
        run: yarn install

      - name: Generate keypair
        run: solana-keygen new --no-bip39-passphrase

      - name: Build program
        run: anchor build

      - name: Run tests
        run: anchor test
