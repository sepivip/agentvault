name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SOLANA_VERSION: 1.18.26
  ANCHOR_VERSION: 0.30.1
  SOLANA_INSTALL_DIR: /home/runner/.local/share/solana

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-anchor-${{ env.ANCHOR_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-anchor-${{ env.ANCHOR_VERSION }}-

      - name: Install Solana
        run: |
          set -euo pipefail
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"

          # Try official installer first (sometimes TLS/IPv6 flakes on runners).
          if ! curl -4 --retry 5 --retry-delay 5 --retry-connrefused --connect-timeout 30 --max-time 300 -sSfL \
            https://release.solana.com/v${{ env.SOLANA_VERSION }}/install | sh; then
            echo "release.solana.com failed, falling back to GitHub release asset"
            ASSET_URL=$(python3 - <<'PY'
import json, os, sys, urllib.request
v = os.environ["SOLANA_VERSION"]
url = f"https://api.github.com/repos/solana-labs/solana/releases/tags/v{v}"
data = json.load(urllib.request.urlopen(url))
asset = None
for a in data.get("assets", []):
    name = a.get("name", "")
    if name.endswith("x86_64-unknown-linux-gnu.tar.bz2"):
        asset = a.get("browser_download_url")
        break
if not asset:
    sys.exit("No Linux x86_64 asset found for Solana release")
print(asset)
PY
            )
            curl -4 --retry 5 --retry-delay 5 --retry-connrefused --connect-timeout 30 --max-time 300 -sSfL \
              "$ASSET_URL" -o /tmp/solana.tar.bz2
            mkdir -p "$HOME/.local/share/solana/install"
            tar -xjf /tmp/solana.tar.bz2 -C "$HOME/.local/share/solana/install"
            ln -sfn "$HOME/.local/share/solana/install/solana-release" "$HOME/.local/share/solana/install/active_release"
          fi
          echo "$SOLANA_BIN" >> $GITHUB_PATH
          echo "PATH=$SOLANA_BIN:$PATH" >> $GITHUB_ENV
          export PATH="$SOLANA_BIN:$PATH"
          solana --version
          solana-keygen --version

      - name: Ensure Cargo bin on PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_VERSION }} anchor-cli --force

      - name: Install dependencies
        run: yarn install

      - name: Generate keypair
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json
          solana config set --url localhost

      - name: Build program
        run: anchor build

      - name: Run tests
        run: anchor test --skip-local-validator
