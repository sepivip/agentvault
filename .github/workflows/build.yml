name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SOLANA_VERSION: 1.18.26
  ANCHOR_VERSION: 0.30.1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Solana, Anchor, and Node
        uses: solana-developers/github-actions/setup-all@v0.2.7
        with:
          solana_version: ${{ env.SOLANA_VERSION }}
          anchor_version: ${{ env.ANCHOR_VERSION }}
          node_version: 20

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Cargo bin on PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify Rust
        run: |
          rustc --version
          cargo --version

      - name: Verify Solana
        run: |
          solana --version
          solana-keygen --version

      - name: Install dependencies
        run: yarn install

      - name: Generate keypair
        run: |
          mkdir -p target/deploy
          solana-keygen new --no-bip39-passphrase -o target/deploy/agentvault-keypair.json --force >/tmp/solana-keygen.log 2>&1
          if [ $? -ne 0 ]; then
            cat /tmp/solana-keygen.log
            exit 1
          fi
          rm -f /tmp/solana-keygen.log
          solana config set --url localhost

      - name: Build program
        run: anchor build

      - name: Run tests
        run: anchor test --skip-local-validator
