name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SOLANA_VERSION: 2.0.0
  ANCHOR_VERSION: 0.31.0
  RUN_TESTS: "false"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Solana, Anchor, and Node
        uses: solana-developers/github-actions/setup-all@v0.2.7
        with:
          solana_version: ${{ env.SOLANA_VERSION }}
          anchor_version: ${{ env.ANCHOR_VERSION }}
          node_version: 20

      - name: Install dependencies
        run: yarn install

      - name: Generate keypair
        run: |
          mkdir -p target/deploy
          solana-keygen new --no-bip39-passphrase -o target/deploy/agentvault-keypair.json --force
          solana config set --url localhost

      - name: Build program
        run: anchor build

      - name: Run tests
        if: env.RUN_TESTS == 'true'
        run: anchor test --skip-local-validator
